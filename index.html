<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Cylinder Slider Editor</title>
<style>html,body{margin:0;width:100%;height:100%;background:#0d0f13;color:#fff;font-family:system-ui,sans-serif}.loading{position:fixed;inset:0;display:grid;place-items:center;font-size:13px;color:#8f98a6}</style>
</head>
<body>
<div class="loading">Loading slider…</div>
<script>
(async()=>{
  let source=await fetch('./app-source.html',{cache:'no-store'}).then(r=>{
    if(!r.ok) throw new Error('Could not load slider source');
    return r.text();
  });

  if(!source.includes('// Active slide scale animation')){
    source=source.replace(
      "let customImageData = {};\nlet targetAngle = deg(state.rotation);",
      "let customImageData = {};\nlet slideScales = [];\nlet targetAngle = deg(state.rotation);"
    );

    source=source.replace(
      "return{center,centerDepth:c.z,strips};\n}\nfunction drawSlide",
      `return{center,centerDepth:c.z,centerPoint:c,strips};
}
function scaleMesh(mesh,factor){
  if(Math.abs(factor-1)<.0001)return mesh;
  const cx=mesh.centerPoint.x,cy=mesh.centerPoint.y;
  const scalePoint=p=>({...p,x:cx+(p.x-cx)*factor,y:cy+(p.y-cy)*factor});
  return{...mesh,strips:mesh.strips.map(s=>({...s,tl:scalePoint(s.tl),tr:scalePoint(s.tr),br:scalePoint(s.br),bl:scalePoint(s.bl)}))};
}
function drawSlide`
    );

    source=source.replace(
      "const step=Math.PI*2/state.count;\nconst nearest=((Math.round(-angle/step)%state.count)+state.count)%state.count;\nfor(const it of items) drawSlide(textures[it.i],it.mesh,it.alpha,it.i===nearest);",
      `const step=Math.PI*2/state.count;
const nearest=((Math.round(-angle/step)%state.count)+state.count)%state.count;

// Active slide scale animation
const scaleEase=1-Math.pow(1-.12,dt*60);
for(let i=0;i<state.count;i++){
  const current=slideScales[i]??1;
  const target=i===nearest?1.12:1;
  slideScales[i]=current+(target-current)*scaleEase;
}
for(const it of items){
  const animatedMesh=scaleMesh(it.mesh,slideScales[it.i]??1);
  drawSlide(textures[it.i],animatedMesh,it.alpha,it.i===nearest);
}`
    );
  }

  if(!source.includes('// One slide per wheel gesture')){
    source=source.replace(
      `canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  const step=Math.PI*2/state.count;
  targetAngle += (e.deltaY>0||e.deltaX>0)?-step:step;
  state.rotation=rad(targetAngle)%360;
  saveState();syncUI();
},{passive:false});`,
      `let wheelGestureActive=false;
let wheelGestureTimer=null;
let wheelAccumulator=0;

// One slide per wheel gesture
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  const dominant=Math.abs(e.deltaY)>=Math.abs(e.deltaX)?e.deltaY:e.deltaX;
  if(!Number.isFinite(dominant)||dominant===0)return;

  clearTimeout(wheelGestureTimer);
  wheelGestureTimer=setTimeout(()=>{
    wheelGestureActive=false;
    wheelAccumulator=0;
  },180);

  if(wheelGestureActive)return;

  wheelAccumulator+=dominant;
  if(Math.abs(wheelAccumulator)<12)return;

  const step=Math.PI*2/state.count;
  targetAngle+=wheelAccumulator>0?-step:step;
  wheelAccumulator=0;
  wheelGestureActive=true;
  state.rotation=rad(targetAngle)%360;
  saveState();syncUI();
},{passive:false});`
    );
  }

  document.open();
  document.write(source);
  document.close();
})().catch(err=>{
  document.body.innerHTML='<div class="loading">'+err.message+'</div>';
  console.error(err);
});
</script>
</body>
</html>
